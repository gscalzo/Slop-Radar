<!--
  16px and 32px variant. The full icon renders to mush at toolbar size — three
  rings, a crosshair and a gradient sweep cannot survive 16 pixels — so the
  small sizes get the same idea drawn with three shapes: one ring, one sweep,
  one contact.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#0d1b2a"/>
  <circle cx="16" cy="16" r="11" fill="#0a2f22" stroke="#2ea043" stroke-width="2.6"/>
  <path d="M16 16 L24.5 8.5" stroke="#3fb950" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="22" cy="11" r="4.6" fill="#ff6b5e" stroke="#0d1b2a" stroke-width="1.6"/>
</svg>
