<!--
  Source of truth for the extension icons; PNGs are generated by
  scripts/make-icons.sh and committed, so nobody needs a converter to build.

  A radar screen with one contact. The palette is the extension's own tier
  colours — green sweep, red blip — so the icon says the same thing the badges
  do: this is a detector, and it has found something.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="sweep" x1="64" y1="64" x2="118" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2ea043" stop-opacity=".85"/>
      <stop offset="1" stop-color="#2ea043" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5a4e" stop-opacity=".9"/>
      <stop offset="1" stop-color="#c62828" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="screen"><circle cx="64" cy="64" r="46"/></clipPath>
  </defs>

  <rect width="128" height="128" rx="28" fill="#0d1b2a"/>

  <!-- screen -->
  <circle cx="64" cy="64" r="46" fill="#0a2f22"/>
  <g stroke="#1a7f37" fill="none">
    <circle cx="64" cy="64" r="46" stroke-width="3" opacity=".95"/>
    <circle cx="64" cy="64" r="31" stroke-width="2.5" opacity=".5"/>
    <circle cx="64" cy="64" r="16" stroke-width="2.5" opacity=".38"/>
    <path d="M64 18v92M18 64h92" stroke-width="2" opacity=".22"/>
  </g>

  <!-- sweep -->
  <g clip-path="url(#screen)">
    <path d="M64 64 L128 64 A64 64 0 0 0 96 8 Z" fill="url(#sweep)"/>
    <path d="M64 64 L118 30" stroke="#3fb950" stroke-width="3.5" stroke-linecap="round" opacity=".95"/>
  </g>

  <!-- contact -->
  <circle cx="88" cy="46" r="16" fill="url(#glow)"/>
  <circle cx="88" cy="46" r="7" fill="#ff6b5e"/>
  <circle cx="88" cy="46" r="7" fill="none" stroke="#0d1b2a" stroke-width="1.5" opacity=".55"/>
</svg>
